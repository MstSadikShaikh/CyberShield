# ===================================================================
# CyberShield - Phishing URL Detector Configuration
# ===================================================================
spring.application.name=cybershield-backend
server.port=${PORT:8080}

# -------------------------------------------------------------------
# Primary Database: MySQL (Mandatory Constraint)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cybershield}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# Hibernate / JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# -------------------------------------------------------------------
# Machine Learning Pretrained ONNX Model Configuration
# -------------------------------------------------------------------
cybershield.model.path=${MODEL_PATH:classpath:model/model.onnx}
cybershield.model.name=Pirocheto LinearSVM ONNX URL Classifier
cybershield.model.version=pirocheto-linear-svm-v1.0
cybershield.model.publisher-metric=94.86% Reported Accuracy (Sklearn LinearSVM)

# -------------------------------------------------------------------
# Google Gemini API Configuration (Optional Secondary Provider)
# -------------------------------------------------------------------
cybershield.gemini.enabled=${GEMINI_ENABLED:false}
cybershield.gemini.api-key=${GEMINI_API_KEY:}
cybershield.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
cybershield.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:10}

# -------------------------------------------------------------------
# Threat Intelligence Configuration (Google Web Risk / Replaceable)
# -------------------------------------------------------------------
cybershield.threat-intel.enabled=${THREAT_INTELLIGENCE_ENABLED:false}
cybershield.threat-intel.provider=${THREAT_INTELLIGENCE_PROVIDER:google-web-risk}
cybershield.threat-intel.api-key=${THREAT_INTELLIGENCE_API_KEY:}
cybershield.threat-intel.timeout-seconds=${THREAT_INTELLIGENCE_TIMEOUT_SECONDS:5}

# -------------------------------------------------------------------
# Security & CORS Configuration
# -------------------------------------------------------------------
cybershield.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
cybershield.history.max-limit=100
cybershield.history.default-limit=20

# Actuator & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
